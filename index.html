
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0001;
    }

    h1 {
      text-align: center;
      color: #e62117;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 7px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      border: none;
      background: #e62117;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #bd1b13;
    }

    #player {
      margin-top: 20px;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .note {
      margin-top: 18px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>YouTube Video Player</h1>

    <label for="videoUrl">YouTube Video Link</label>
    <input
      id="videoUrl"
      type="url"
      placeholder="https://www.youtube.com/watch?v=..."
    >

    <label for="repeatCount">Repeat Count (for your plan)</label>
    <input
      id="repeatCount"
      type="number"
      min="1"
      max="100"
      value="5"
    >

    <button onclick="loadVideo()">Load Video</button>

    <div id="player"></div>

    <p id="status">Paste a YouTube link to begin.</p>

    <p class="note">
      This player is for viewing and testing. Repeat count is a target
      only; it does not automatically replay videos or verify views.
      Start playback using the YouTube player controls.
    </p>
  </div>

  <script>
    function loadVideo() {
      const url = document.getElementById("videoUrl").value.trim();
      const count = Number(
        document.getElementById("repeatCount").value
      );

      let videoId = "";

      try {
        const parsed = new URL(url);

        if (parsed.hostname === "youtu.be") {
          videoId = parsed.pathname.slice(1);
        } else if (
          parsed.hostname === "youtube.com" ||
          parsed.hostname === "www.youtube.com" ||
          parsed.hostname === "m.youtube.com"
        ) {
          if (parsed.pathname === "/watch") {
            videoId = parsed.searchParams.get("v") || "";
          } else {
            const parts = parsed.pathname.split("/");
            if (["embed", "shorts"].includes(parts[1])) {
              videoId = parts[2] || "";
            }
          }
        }
      } catch (error) {
        document.getElementById("status").textContent =
          "Please enter a valid YouTube URL.";
        return;
      }

      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        document.getElementById("status").textContent =
          "Invalid YouTube video link.";
        return;
      }

      if (!Number.isInteger(count) || count < 1 || count > 100) {
        document.getElementById("status").textContent =
          "Choose a count between 1 and 100.";
        return;
      }

      document.getElementById("player").innerHTML = `
        <iframe
          src="https://www.youtube-nocookie.com/embed/${videoId}"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write;
          encrypted-media; gyroscope; picture-in-picture;
          web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      `;

      document.getElementById("status").textContent =
        "Video loaded. Your selected repeat target is " +
        count + ".";
    }
  </script>
</body>
</html>
